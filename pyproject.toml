[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-steganalysis-empirical"
version = "0.2.0"
description = "Auditable AP/PA chest X-ray steganalysis experiments for an independent lab environment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.1", "Pillow>=10", "PyYAML>=6", "torch>=2.2", "matplotlib>=3.8", "psutil>=5.9", "scikit-learn>=1.4"]

[project.optional-dependencies]
srm = ["sealwatch==2025.9", "scipy>=1.11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
